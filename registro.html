<body>
    <main>
        <h2>Registro</h2>
            <form action="" method="get">
                <fieldset>
                    <legend>Formulario de registro:</legend>
                        <p>
                            <label for="name">Nombre completo: </label>
                            <input type="text" name="name" id="name" size="30">
                        </p>

                        <p>
                            <label for="nacimiento">Fecha de nacimiento: </label>
                            <input type="date">
                        </p>

                        <p>
                            <label for="email">E-mail: </label>
                            <input type="email" name="email" id="email" size="41">
                        </p>

                        <p>
                            <label for="direccion"> Dirección: </label>
                            <input type="text" name="direccion" id="direccion" size="38">
                        </p>

                        <p>
                            <label for="url">Direccion Web: </label>
                            <input type="url" name="url" id="url" placeholder="https://tupaginaweb.com" size="33">
                        </p>

                        <p>
                            <label for="foto">Envía una foto tuya:</label>
                            <input type="file" name="foto" id="foto">
                        </p>

                        <p>
                            <label for="biografia">Escribe aquí una breve biografía:</label><br>
                            <textarea name="biografia" id="biografia" cols="50" rows="6"></textarea>
                        </p>

                </fieldset>
            </form>
        
    </main>
</body>
